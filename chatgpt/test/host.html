<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>PDFSpacer test host</title>
    <style>
        html, body { margin:0; height:100%; }
        iframe { display:block; width:100%; height:100vh; border:0; }
    </style>
</head>

<body>
    <!-- Opaque-origin sandbox: the app gets no storage and no same-origin access, like a strict MCP Apps host. -->
    <iframe name="pdfspacer" title="PDFSpacer" sandbox="allow-scripts allow-forms"></iframe>
    <script src="/host.js"></script>
    <script>
        const { AppBridge, PostMessageTransport, z } = McpHost;
        const RESOURCE_URI = 'host-resource://sample';
        const mode = new URLSearchParams(location.search).get('mode') ?? 'file';
        const toolInputs = {
            file: { file: { name: 'sample.pdf', resourceUri: RESOURCE_URI } },
            picked: {},
        };

        const log = { initialized: false, reads: [], writes: [], subscriptions: [], downloads: [] };
        /** The opened file as ChatGPT holds it. Tests change it to simulate edits made elsewhere. */
        const file = { blob: '', version: 1, writable: true, maxBytes: 50 * 1024 * 1024 };
        const etag = () => `v${file.version}`;

        const bridge = new AppBridge(
            null,
            { name: 'pdfspacer-test-host', version: '1.0.0' },
            { experimental: { 'openai/resource': {} }, downloadFile: {}, serverResources: {} },
            { hostContext: { theme: 'light', displayMode: 'fullscreen', availableDisplayModes: ['fullscreen'], platform: 'desktop' } },
        );

        function write({ uri, ifMatch, blob }) {
            if (uri !== RESOURCE_URI) throw new Error(`Writes are limited to ${RESOURCE_URI}.`);
            if (ifMatch && ifMatch !== etag()) return { outcome: 'conflict', etag: etag() };
            if (atob(blob).length > file.maxBytes) return { outcome: 'too-large', maxBytes: file.maxBytes };
            file.blob = blob;
            file.version += 1;
            return { outcome: 'saved', etag: etag() };
        }

        bridge.onreadresource = async params => {
            log.reads.push(params);
            if (params.uri !== RESOURCE_URI) throw new Error(`Unknown resource ${params.uri}`);
            return {
                contents: [{
                    uri: RESOURCE_URI,
                    mimeType: 'application/pdf',
                    blob: file.blob,
                    _meta: { 'openai/resource': { etag: etag(), writable: file.writable } },
                }],
            };
        };
        bridge.setRequestHandler(
            z.object({ method: z.literal('openai/resources/write'), params: z.object({ uri: z.string(), ifMatch: z.string().optional(), blob: z.string() }) }),
            ({ params }) => {
                const result = write(params);
                log.writes.push({ ...params, result });
                return result;
            },
        );
        for (const method of ['resources/subscribe', 'resources/unsubscribe']) {
            bridge.setRequestHandler(z.object({ method: z.literal(method), params: z.object({ uri: z.string() }) }), ({ params }) => {
                log.subscriptions.push({ method, uri: params.uri });
                return {};
            });
        }
        bridge.ondownloadfile = async params => {
            log.downloads.push(params);
            return {};
        };
        bridge.oninitialized = () => {
            log.initialized = true;
            bridge.sendToolInput({ arguments: toolInputs[mode] });
        };

        window.host = {
            log,
            file,
            original: '',
            notifyUpdated: () => bridge.notification({ method: 'notifications/resources/updated', params: { uri: RESOURCE_URI } }),
            replaceFile(blob) {
                file.blob = blob;
                file.version += 1;
                return this.notifyUpdated();
            },
        };

        async function start() {
            const bytes = new Uint8Array(await (await fetch('/sample.pdf')).arrayBuffer());
            host.original = file.blob = btoa(Array.from(bytes, byte => String.fromCharCode(byte)).join(''));
            const iframe = document.querySelector('iframe');
            await bridge.connect(new PostMessageTransport(iframe.contentWindow, iframe.contentWindow));
            iframe.src = '/app.html';
        }

        start();
    </script>
</body>
</html>
